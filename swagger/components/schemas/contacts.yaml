type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - contactType
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+380931112233'
  email:
    description: "Contact's email"
    type: string
    example: 'john-doe@gmail.com'
  isFavourite:
    description: 'True if contact is favourite'
    type: boolean
    example: true
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
    example: 'work'
  photo:
    description: "Link to contact's photo"
    type: string
    example: 'https://res.cloudinary.com/dlatnus8p/image/upload/v1730722265/fjc6oynw…'
