tags:
  - Auth
summary: Registration of the user
operationId: registerUser
description: 'Registration of the user'
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: "User's name"
            type: string
            example: 'Don Doe'
          email:
            description: "User's email"
            type: string
            example: 'don-doe@gmail.com'
          password:
            description: "User's password"
            type: string
            example: scvsf234kb
responses:
  '201':
    description: Registered a new user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a user!
            data:
              type: object
              $ref: '../../components/schemas/users.yaml'
  '409':
    description: Email already in use
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 409
            message:
              type: string
              example: 'Email already in use'
  '404':
    $ref: ../../components/responses/404.yaml
